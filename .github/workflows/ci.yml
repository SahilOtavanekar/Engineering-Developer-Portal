name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn tsc

      - name: Format check
        run: yarn prettier:check

      - name: Lint
        run: yarn lint:all

      - name: Test
        run: yarn test
