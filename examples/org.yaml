---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-user
# The identity every visitor signs in as while guest is the only sign-in
# method: auth.providers.guest.userEntityRef in app-config.yaml points here.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  profile:
    displayName: Guest
  memberOf: [guests]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
spec:
  type: team
  children: []
---
# Kept though nothing signs in as it any more: GitHub sign-in, whose
# `usernameMatchingUserEntityName` resolver matched this name, was removed
# 2026-09-27. Entra ID, the planned replacement, will need real User entities.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: sahilotavanekar
spec:
  profile:
    displayName: Sahil Otavanekar
    email: sahil.otavanekar@demandai.co
  memberOf: [platform]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform
  description: Platform engineering team
spec:
  type: team
  children: []
---
# Placeholder owner for repositories ingested from Bitbucket before real
# ownership data exists. Repositories owned by this group are the backlog the
# ownership campaign works through -- they must stay visible and countable.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: unowned
  description: Repositories with no identified owner yet
spec:
  type: team
  children: []
