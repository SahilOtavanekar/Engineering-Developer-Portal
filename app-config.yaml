app:
  title: Demand AI Engineering Portal
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Configure the catalog index page to be the root page, this is normally mounted on /catalog
    - page:catalog:
        config:
          path: /

    # Relation cards with no data source, disabled rather than left empty.
    #
    # Measured against the live catalog: `dependsOn`/`dependencyOf` is ZERO
    # across the whole estate, and no Component has a subcomponent. The only
    # `hasPart` relations are the System->Component links the Bitbucket entity
    # provider emits from `project_key`. All 35 manifests were checked and none
    # references another repository, so section 5 (relationship mapping) has no
    # data source; these three cards can never fill, and an always-empty card
    # teaches people that the page is broken.
    #
    # Safe to disable, unlike a page: nothing resolves a route ref to a card.
    # Catalog filters with nothing to filter on.
    #
    # Namespace: all 124 entities are in `default` and always will be --
    # `entityName.ts` hardcodes it, and namespaces exist to separate tenants
    # with colliding entity names, which a single workspace does not have. The
    # dropdown offered one option that selected everything.
    #
    # Processing status: zero entities have processing errors and zero are
    # orphaned. Removed at the product owner's direction; it is a diagnostic
    # rather than a data view, so re-enable it when chasing a processing
    # failure -- both the migration failures and the orphaned
    # meeting-room-booking entities would have shown up here.
    #
    # Safe to disable, unlike a page: nothing resolves a route ref to a filter.
    - catalog-filter:catalog/namespace: false
    - catalog-filter:catalog/processing-status: false

    # Classification is by Owner and Tag only, at the product owner's
    # direction. The four below are removed rather than left as controls that
    # narrow the list in ways nobody asked for:
    #
    # - kind: every row is a Component. `initialKind` in
    #   `packages/app/src/modules/catalog` pins it now -- WITHOUT that the kind
    #   is unconstrained and Systems, Users and Groups appear in the table.
    # - type: `spec.type` is `service` or `unknown` across nearly the estate,
    #   because nothing distinguishes a library from an abandoned service.
    # - lifecycle: `spec.lifecycle` is `unknown` for the same reason.
    # - list: the Personal block -- Owned 0, Starred 0. **Removing it requires
    #   `initiallySelectedFilter="all"`** on the page, which is set alongside
    #   `initialKind`: the prop defaults to 'owned' and the picker was the only
    #   thing rescuing that. Without both, the catalog renders zero rows.
    #   (This filter also has an `initialFilter` config key, so it could be
    #   configured to open on "All" instead of being removed.)
    #
    # The Owner filter's extension is named `mode`, NOT `owner` -- it is
    # `EntityOwnerPicker`, and `catalog-filter:catalog/owner` does not exist.
    # It and `catalog-filter:catalog/tag` are the two deliberately left on.
    - catalog-filter:catalog/kind: false
    - catalog-filter:catalog/type: false
    - catalog-filter:catalog/lifecycle: false
    - catalog-filter:catalog/list: false
    # Tag: replaced by Project. Tags carry a derived language and are absent on
    # most rows -- of 98 components only the 32 with a detected language have
    # one -- so the filter offered a handful of values that between them
    # matched a third of the estate. Project is on every row and the six values
    # partition the catalog cleanly (MDLH 37, AM 21, DDS 20, DAARWYN 12,
    # DAIWEB 4, RES 4). The Tags COLUMN stays; only the filter goes.
    - catalog-filter:catalog/tag: false

    # Replaced by entity-card:fleet/about. The stock card's field grid uses
    # viewport breakpoints ({1, sm 2, lg 3}) while the card sits in the entity
    # layout's narrow 1fr sidebar, so on a wide screen it rendered three columns
    # into a ~350px card and overflowed sideways.
    - entity-card:catalog/about: false

    # Replaced by entity-card:catalog/project-repositories, which drops the
    # Lifecycle and Type columns. **Registering an override under the stock
    # name did NOT replace it** -- both cards rendered, so a project's page
    # carried two tables and Lifecycle survived in the second. Disabling the
    # stock one and registering ours under its own name is unambiguous.
    - entity-card:catalog/has-components: false

    # Zero Resource entities exist -- the catalog holds 98 Components, 20
    # Users, 6 Systems, 3 Groups and 1 Location -- so this card can only ever
    # render "No resource is part of this system", with a Lifecycle column
    # heading above nothing. It was the sole remaining source of the word
    # Lifecycle on a project's page.
    - entity-card:catalog/has-resources: false

    - entity-card:catalog/depends-on-components: false
    - entity-card:catalog/depends-on-resources: false
    - entity-card:catalog/has-subcomponents: false

organization:
  name: Demand AI

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog

# `integrations:` is NOT declared here, because the only one this portal needs
# carries a credential and so cannot be committed.
#
#   integrations.bitbucketCloud is REQUIRED. It is the portal's single most
#   load-bearing piece of config: `fleetPlugin` reads it through
#   `ScmIntegrations.fromConfig(config).bitbucketCloud.byHost('bitbucket.org')`
#   and refuses to start the ingestion passes without it, and it is what makes
#   an entity's "View Source" link resolve. Set it in `app-config.local.yaml`:
#
#     integrations:
#       bitbucketCloud:
#         - username: <bitbucket username, NOT an email>
#           appPassword: <app password>
#
# `integrations.github` was removed on 2026-09-02: nothing consumed it. GitHub
# sign-in reads `auth.providers.github` below, which is a different key, and no
# catalog location points at github.com. A `${GITHUB_TOKEN}` placeholder that
# feeds nothing reads as a required credential and is not one.

# `proxy:` is deliberately absent. `plugin-proxy-backend` is still loaded and
# needs no config to start; add a `proxy.endpoints` block here when something
# actually needs proxying. The key on its own parsed as null and configured
# nothing.

auth:
  environment: development
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # Matches the GitHub login against a User entity of the same name in
            # the catalog. See examples/org.yaml for how to register your user.
            - resolver: usernameMatchingUserEntityName

    # See https://backstage.io/docs/auth/guest/provider
    guest: {}
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    # The portal's people and groups. Not example data despite the folder name:
    # `sahilotavanekar` is what the `usernameMatchingUserEntityName` sign-in
    # resolver matches a GitHub login against, and `unowned` is the placeholder
    # group every repository without a confirmed owner is counted against.
    # File locations are relative to the backend process, typically
    # `packages/backend`.
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'Demand AI Engineering Portal' # defaults to "backstage"
  description: 'Tools for exploring the Bitbucket repository catalog, its ownership and its health scores' # optional

# Engineering portal -- repository fleet ingestion.
fleet:
  bitbucket:
    # Workspaces cannot be discovered: Atlassian removed the enumeration
    # endpoints (CHANGE-2770), so they must be listed explicitly.
    workspaces:
      - demandai
  ownership:
    # Confirmed ownership, from the repository standardization document. This is
    # the only source the portal treats as authoritative; admin permission and
    # commit history are inferences behind it. Kept in its own file so it can be
    # reviewed and corrected without touching config.
    register:
      $include: ./catalog/ownership-register.yaml

  identity:
    # Who the commit authors are. Bitbucket gives an address per commit and
    # nothing more, and this estate has 29 addresses for 22 humans -- so raw
    # addresses would report five people as several engineers each. Until Entra
    # ID supplies a directory, this file is the directory.
    register:
      $include: ./catalog/identity-register.yaml
