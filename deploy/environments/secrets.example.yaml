# TEMPLATE -- committed, holds no real values.
#
# Copy to deploy/environments/<env>/secrets.yaml (gitignored) and fill in:
#   cp deploy/environments/secrets.example.yaml deploy/environments/dev/secrets.yaml
#
# Use DIFFERENT values per environment. Every key here is required; the chart
# refuses to render with any of them missing, rather than producing a pod that
# hangs NotReady.

postgresql:
  auth:
    # internal mode: any strong random value (e.g. `openssl rand -hex 24`),
    #   applied when the volume is first created.
    # external mode: the RDS user's password. That user needs CREATEDB.
    username: backstage
    password: ''

bitbucket:
  # EITHER an access token (sent as Bearer): workspace/repository access token
  # with read on repositories, pull requests and pipelines.
  token: ''
  # OR username + password (sent as Basic):
  #   - Atlassian API token: username = your Atlassian account EMAIL,
  #     appPassword = the API token
  #   - legacy app password: username = Bitbucket username (not email)
  username: ''
  appPassword: ''

ecr:
  pullSecret:
    aws:
      # IAM user with pull-only ECR permissions (see deploy/README.md).
      accessKeyId: ''
      secretAccessKey: ''
