# DEV -- non-secret settings. Committed.
# Credentials go in deploy/environments/dev/secrets.yaml (gitignored; copy
# deploy/environments/secrets.example.yaml).
#
# Every REPLACE below must be filled before the first deploy.

environment: dev

image:
  # The ECR repository, created by the AWS team (region us-east-1).
  repository: 724772056297.dkr.ecr.us-east-1.amazonaws.com/dai-engineering-portal
  # Printed by deploy/scripts/build-push.sh. deploy.sh can also override it:
  #   deploy/scripts/deploy.sh dev <tag>
  tag: REPLACE_WITH_TAG

ecr:
  pullSecret:
    enabled: true

portal:
  auth:
    # Guest is the only sign-in method (GitHub removed 2026-09-27), so this
    # must stay true -- the chart refuses to render otherwise. It signs anyone
    # who reaches the host in as user:default/guest, which with
    # allow-all-policy includes every engineer's productivity figures
    # (CLAUDE.md open decision 6). Keep the host internal.
    allowGuestSignIn: true

ingress:
  enabled: true
  className: nginx
  # sslip.io resolves <anything>.<ip>.sslip.io to <ip>, so no DNS record is
  # needed. It is this cluster's own convention: its other apps are served as
  # <name>.10.100.128.11.sslip.io. Verified 2026-09-29: this name resolves to
  # 10.100.128.11 and the cluster's ingress-nginx answers on it.
  host: engineering-portal.10.100.128.11.sslip.io
  annotations:
    {}
    # cert-manager, if the cluster has it:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    # HTTPS IS REQUIRED, not optional -- measured 2026-09-27 through a real
    # ingress-nginx. Over plain http on a real host name the browser does not
    # treat the page as a secure context, so crypto.randomUUID is missing and
    # Search returns nothing (the chart drops upgrade-insecure-requests for
    # http so the app at least boots, but that is all it fixes). localhost is
    # exempt, which is why a port-forward never shows either problem.
    # Needs a kubernetes.io/tls Secret with this name in the namespace -- a
    # corporate certificate, or let cert-manager issue it (annotation above).
    enabled: true
    secretName: fleet-portal-dev-tls
    # No certificate from IT yet, so the chart generates a self-signed one:
    # HTTPS still works (which Search needs), but each browser warns once.
    # For a real certificate: set false and create the Secret above yourself.
    selfSigned: true

postgresql:
  mode: internal
  internal:
    persistence:
      # From `kubectl get storageclass` on the dev cluster, 2026-09-29:
      # `longhorn` is its default (reclaim Retain, so the volume outlives the
      # PVC). It has no local-path class -- the earlier value here would have
      # left the PVC Pending for ever, with no error naming the cause.
      storageClass: longhorn
      size: 8Gi
