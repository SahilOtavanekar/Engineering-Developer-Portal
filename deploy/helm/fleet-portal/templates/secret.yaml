{{- include "fleet-portal.validate" . -}}
{{- /*
Environment variables app-config.yaml reads through ${...}.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet-portal.fullname" . }}-env
  labels:
    {{- include "fleet-portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
---
{{- /*
Bitbucket must be a config FILE, not environment variables:
integrations.bitbucketCloud is a list, and an unset ${VAR} makes Backstage drop
the key -- turning a clear "no credentials" error into a schema failure on a
half-built list entry.
*/ -}}
{{- $bb := dict -}}
{{- if .Values.bitbucket.token -}}
{{- $_ := set $bb "token" .Values.bitbucket.token -}}
{{- else -}}
{{- $_ := set $bb "username" .Values.bitbucket.username -}}
{{- $_ := set $bb "appPassword" .Values.bitbucket.appPassword -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet-portal.fullname" . }}-app-config
  labels:
    {{- include "fleet-portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  app-config.secrets.yaml: |
    {{- toYaml (dict "integrations" (dict "bitbucketCloud" (list $bb))) | nindent 4 }}
