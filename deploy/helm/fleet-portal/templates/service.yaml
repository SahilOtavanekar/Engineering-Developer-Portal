apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet-portal.fullname" . }}
  labels:
    {{- include "fleet-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "fleet-portal.selectorLabels" (dict "root" . "component" "portal") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
