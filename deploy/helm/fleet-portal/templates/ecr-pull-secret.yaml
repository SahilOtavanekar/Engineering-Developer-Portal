{{- if .Values.ecr.pullSecret.enabled }}
{{- /*
ECR pull credentials for a non-EKS cluster.

An ECR token lasts 12 hours, so this writes the dockerconfigjson Secret the
portal pulls with, and keeps rewriting it:

  - a pre-install/pre-upgrade hook Job, so the Secret exists before the
    Deployment's first pull -- and `helm install` fails fast, naming the Job,
    if the AWS credentials are wrong;
  - a CronJob that refreshes it every ecr.pullSecret.schedule.

The supporting objects (AWS key Secret, ServiceAccount, Role, RoleBinding) are
hooks too, at a lower weight, because a pre-install hook runs before any
ordinary release resource exists. Consequence: `helm uninstall` leaves them
behind (along with the pull secret the job wrote). Delete the namespace to
remove everything.

Two containers because no single small image carries both tools: aws-cli
writes the full Secret manifest into a memory-backed emptyDir, and the
shell-less kubectl image applies it.
*/ -}}
{{- $fullname := include "fleet-portal.fullname" . -}}
{{- $saName := printf "%s-ecr-refresh" $fullname -}}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation" -}}
{{- if not .Values.ecr.pullSecret.aws.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet-portal.ecrAwsSecretName" . }}
  labels:
    {{- include "fleet-portal.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: '-10'
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.ecr.pullSecret.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.ecr.pullSecret.aws.secretAccessKey | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  labels:
    {{- include "fleet-portal.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: '-10'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  labels:
    {{- include "fleet-portal.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: '-10'
rules:
  # `create` cannot be restricted by name in RBAC; everything else is limited
  # to the one pull secret.
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['create']
  - apiGroups: ['']
    resources: ['secrets']
    resourceNames: [{{ .Values.ecr.pullSecret.name | quote }}]
    verbs: ['get', 'patch', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  labels:
    {{- include "fleet-portal.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: '-10'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-ecr-refresh-init
  labels:
    {{- include "fleet-portal.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: '-5'
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "fleet-portal.labels" . | nindent 8 }}
        app.kubernetes.io/component: ecr-refresh
    spec:
      {{- include "fleet-portal.ecrRefreshPodSpec" (dict "root" . "saName" $saName) | nindent 6 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-ecr-refresh
  labels:
    {{- include "fleet-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: ecr-refresh
spec:
  schedule: {{ .Values.ecr.pullSecret.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            {{- include "fleet-portal.labels" . | nindent 12 }}
            app.kubernetes.io/component: ecr-refresh
        spec:
          {{- include "fleet-portal.ecrRefreshPodSpec" (dict "root" . "saName" $saName) | nindent 10 }}
{{- end }}

{{- define "fleet-portal.ecrRefreshPodSpec" -}}
{{- $root := .root -}}
serviceAccountName: {{ .saName }}
restartPolicy: Never
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
initContainers:
  - name: fetch-token
    image: {{ $root.Values.ecr.pullSecret.awsCliImage }}
    command: ['/bin/sh', '-ec']
    args:
      - |
        TOKEN=$(aws ecr get-login-password --region "$AWS_REGION")
        AUTH=$(printf 'AWS:%s' "$TOKEN" | base64 -w0)
        CFG=$(printf '{"auths":{"%s":{"username":"AWS","password":"%s","auth":"%s"}}}' "$REGISTRY" "$TOKEN" "$AUTH" | base64 -w0)
        printf '{"apiVersion":"v1","kind":"Secret","type":"kubernetes.io/dockerconfigjson","metadata":{"name":"%s","labels":{"app.kubernetes.io/instance":"%s","app.kubernetes.io/component":"ecr-pull-secret"}},"data":{".dockerconfigjson":"%s"}}' \
          "$SECRET_NAME" "$RELEASE" "$CFG" > /work/secret.json
        echo "ECR token fetched for $REGISTRY ($AWS_REGION)"
    env:
      - name: HOME
        value: /work
      - name: AWS_REGION
        value: {{ include "fleet-portal.ecrRegion" $root | quote }}
      - name: REGISTRY
        value: {{ include "fleet-portal.ecrRegistry" $root | quote }}
      - name: SECRET_NAME
        value: {{ $root.Values.ecr.pullSecret.name | quote }}
      - name: RELEASE
        value: {{ $root.Release.Name | quote }}
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: {{ include "fleet-portal.ecrAwsSecretName" $root }}
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: {{ include "fleet-portal.ecrAwsSecretName" $root }}
            key: AWS_SECRET_ACCESS_KEY
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    volumeMounts:
      - name: work
        mountPath: /work
containers:
  - name: apply-secret
    image: {{ $root.Values.ecr.pullSecret.kubectlImage }}
    args: ['apply', '-f', '/work/secret.json']
    env:
      # kubectl's discovery cache wants a writable home.
      - name: HOME
        value: /tmp
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    volumeMounts:
      - name: work
        mountPath: /work
        readOnly: true
volumes:
  # Memory-backed: the token never touches a node's disk.
  - name: work
    emptyDir:
      medium: Memory
      sizeLimit: 1Mi
{{- end -}}
