# Who the commit authors actually are.
#
# Bitbucket gives an email per commit and nothing more, and an email is not a
# person: this estate has 29 distinct addresses for roughly 22 humans. Six
# people commit under more than one address, so aggregating raw addresses
# would report each of them as several engineers -- and productivity figures
# that split one person in two are worse than no figures.
#
# Addresses are compared NORMALISED: lowercased, then reduced to the
# characters legal in an address. That alone merges Shalvi Mishra, whose git
# config wrapped her address in smart quotes (U+201C/U+201D) for 259 of her
# commits -- no alias entry is needed for that case.
#
# Read through fleet.identity.register in app-config.yaml. Edit and restart;
# no deploy, no migration. Until Entra ID supplies a real directory, this file
# IS the directory.

# Names are the human's name, not the most-used git config. Generating this
# file by "most commits wins" produced `shekhar.tanwar`, `Mann140` and
# `Pradnya gomase`, because a login or a typo can outnumber the real name --
# Shekhar's login form has 127 commits against 89 for his name. Fixed by hand;
# keep them that way.
people:
