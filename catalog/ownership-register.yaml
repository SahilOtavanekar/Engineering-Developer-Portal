# Confirmed repository ownership.
#
# Transcribed from "Bitbucket repository standardization" (Demand AI) and
# reconciled against the portal's derived owners on 2026-08-26. This is the
# only *confirmed* ownership source the portal has. Everything else it knows is
# inferred from Bitbucket admin permissions or commit history, which measured
# 76% and 78% accurate against this document.
#
# Edit this file to correct ownership: it is read through
# `fleet.ownership.register` in app-config.yaml and needs a restart, not a
# deploy. A repository absent from `repositories` below falls back to the
# derived resolvers and is still reported as unconfirmed.

# The document names people by first name only. These are the identities those
# names resolved to, taken from commit authors and Bitbucket admins the portal
# already holds. A name that cannot be resolved to exactly one person is left
# out on purpose, so the resolver produces no candidate rather than a guess.
# `Shubham` on website-tracking is the one such case: this estate contains both
# Subham Jain and Shubham Sharma, and the document does not say which.
